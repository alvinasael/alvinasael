<script>
// Video vertical 1080×1920, 77 s. Todo es función del tiempo: renderAt(t) dibuja el cuadro exacto.
const W = 1080, H = 1920, DUR = 77;
const cv = document.getElementById('c'), c = cv.getContext('2d');
const K = { green: '#2B4038', greenMid: '#3D5C4F', greenLight: '#D4E4DD', greenPale: '#EBF3EF', cream: '#F7F3ED', creamDark: '#EDE8DF',
  amber: '#C4832B', amberLight: '#F5E8D6', char: '#1E1C19', char60: '#6B6760', char30: '#C2C0BC', white: '#FFFFFF',
  skin: '#E8DCCE', brain: '#C9A394', stomach: '#CFA592', liver: '#A66F5E', pancreas: '#D8B36C', gut: '#DDB9A6' };
const SANS = '"DM Sans", system-ui, sans-serif', SERIF = '"Playfair Display", Georgia, serif';

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const prog = (t, s, d) => clamp((t - s) / d, 0, 1);
const win = (t, a, b, f = .45) => Math.min(prog(t, a, f), 1 - prog(t, b - f, f));   // visible entre a y b, con fundido
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
const R = rng(77);
const RBC = Array.from({ length: 7 }, () => ({ x0: R() * 1400, y: 590 + R() * 250, v: 70 + R() * 30, s: 1.7 + R() * .7, tilt: (R() - .5) * .5 }));
const HX = Array.from({ length: 7 }, () => ({ x0: R() * 1300, y: 580 + R() * 260, v: 95 + R() * 35, ph: R() * 6.28 }));

// ── Guion: texto en pantalla ──────────────────────────────────────────────
const CAPS = [
  [0, 6, '¿Sabías que tu cuerpo ya produce GLP-1? Cada vez que comes, tu intestino lo suelta.', 1],
  [6, 13, 'Es una hormona mensajera: avisa que llegó comida. Pero la natural dura apenas unos minutos.'],
  [13, 20, 'El medicamento GLP-1 es una copia que dura mucho más. Por eso muchas se aplican una vez por semana.'],
  [20, 27, 'Al páncreas le dice: suelta insulina, pero solo cuando la glucosa está alta.'],
  [27, 32, 'Al hígado: suelta menos azúcar.'],
  [32, 37, 'Al estómago: vacíate más despacio.'],
  [37, 42, 'Y al cerebro: ya estás lleno.'],
  [42, 45, 'Cuatro factores que trabajan juntos.', 1],
  [45, 49, 'Uno: más insulina, justo cuando hace falta.'],
  [49, 53, 'Dos: menos azúcar saliendo del hígado.'],
  [53, 57, 'Tres: la comida entra más despacio.'],
  [57, 61, 'Cuatro: menos hambre, así que se come menos.'],
  [61, 67, 'Juntos logran lo principal: una glucosa más estable, después de comer y en ayunas.', 1],
  [67, 70.6, 'Y como beneficio adicional: para muchas personas, menos peso.'],
  [70.6, 74, 'Algunos GLP-1 también protegen el corazón y los riñones.'],

// ── Clips de video (ElevenCreative · Seedance 2.5), guardados como cuadros JPG en clips/<nombre>/ ──
// [clip, inicio, fin (segundos reales del video), desde, hasta (segundos del clip), fundido de entrada, de salida]
window.CLIPN = window.CLIPN || {};
const SHOTS = [['plato', 0, 1.95, 0, 1.95, 0, .5], ['persona', 1.45, 3.8, 2.45, 4.95, .5, .75], ['pluma', 19.3, 22.75, .6, 4.4, .5, .55],
  ['camina', 68.9, 74.7, 0, 4.96, .5, .5], ['cierre', 77.3, 80.6, 1.6, 4.96, .6, .01]].filter(sh => CLIPN[sh[0]]);
const shotA = (sh, tv) => tv < sh[1] || tv > sh[2] ? 0 : Math.min(sh[5] ? prog(tv, sh[1], sh[5]) : 1, 1 - prog(tv, sh[2] - sh[6], sh[6]));
const shotF = (sh, tv) => clamp(Math.round(lerp(sh[3], sh[4], clamp((tv - sh[1]) / (sh[2] - sh[1]), 0, 1)) * 30), 0, CLIPN[sh[0]] - 1);
const clipSrc = (n, i) => `clips/${n}/f${String(i + 1).padStart(3, '0')}.jpg`;
const CACHE = new Map();
window.prepare = tv => { const need = SHOTS.filter(sh => shotA(sh, tv) > 0).map(sh => clipSrc(sh[0], shotF(sh, tv)));
  const ps = need.map(src => { if (!CACHE.has(src)) { const im = new Image(), p = new Promise(r => { im.onload = r; im.onerror = r; }); im.src = src; CACHE.set(src, { im, p }); } return CACHE.get(src).p; });
  for (const k of [...CACHE.keys()]) { if (CACHE.size <= 48) break; if (!need.includes(k)) CACHE.delete(k); }
  return Promise.all(ps); };
function drawClips(tv, late) {
  let top = 0;
  for (const sh of SHOTS) { if ((sh[1] > 60) !== late) continue; const a = shotA(sh, tv); if (a <= 0) continue; const e = CACHE.get(clipSrc(sh[0], shotF(sh, tv))); if (!e || !e.im.naturalWidth) continue;
    c.save(); c.globalAlpha = a;
    if (sh[0] === 'pluma' && tv > sh[1] + sh[5]) { c.save(); c.globalAlpha = 1; c.fillStyle = K.cream; c.fillRect(0, 0, W, H); c.restore(); }
    if (sh[0] === 'persona') { const z = 1 + .4 * ease(prog(tv, 2.95, .85)); c.translate(540, 1500); c.scale(z, z); c.translate(-540, -1500); }
    c.drawImage(e.im, 0, 0, W, H); c.restore(); top = Math.max(top, a); }
  if (late) pill('Menos peso', 540, 300, win(tv, 70.87, 74.4, .35), K.green, K.white, 40);
  return top;
}

// ── Primitivas ────────────────────────────────────────────────────────────
function rr(x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function wrap(text, maxW) { const words = text.split(' '), lines = []; let cur = ''; for (const w of words) { const t = cur ? cur + ' ' + w : w; if (c.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; } if (cur) lines.push(cur); return lines; }
function helix(x, y, s, rot, a, ph, tail) {

  c.save(); c.globalAlpha *= a; c.translate(x, y); c.rotate(rot); c.scale(s, s); c.lineCap = 'round'; c.lineJoin = 'round';

  if (tail) { c.strokeStyle = K.amber; c.lineWidth = 2; c.beginPath(); c.moveTo(2, Math.sin(16 * .68 + ph) * 4.2); c.quadraticCurveTo(6, 12, 13, 11); c.stroke(); c.fillStyle = K.amber; c.beginPath(); c.arc(13, 11, 2.2, 0, 6.283); c.fill(); }
  path(); c.strokeStyle = K.greenMid; c.lineWidth = 5.2; c.stroke();
  path(); c.strokeStyle = K.greenLight; c.lineWidth = 1.8; c.stroke();
  c.restore();
}
function hex(x, y, s, rot, a) {
  if (a <= .01) return;
  c.save(); c.globalAlpha *= a; c.translate(x, y); c.rotate(rot); c.scale(s, s);
  c.beginPath(); for (let i = 0; i < 6; i++) { const t = i * Math.PI / 3 - Math.PI / 2; i ? c.lineTo(Math.cos(t) * 6.6, Math.sin(t) * 6.6) : c.moveTo(Math.cos(t) * 6.6, Math.sin(t) * 6.6); }
  c.closePath(); c.fillStyle = '#EBC48B'; c.fill(); c.strokeStyle = K.amber; c.lineWidth = 1.7; c.lineJoin = 'round'; c.stroke();
  c.beginPath(); c.moveTo(5.7, -3.3); c.lineTo(10, -6.4); c.stroke();
  c.fillStyle = K.char60; c.beginPath(); c.arc(0, -6.6, 1.9, 0, 6.283); c.fill(); c.restore();
}
function insulin(x, y, s, rot, a) {
  if (a <= .01) return;
  c.save(); c.globalAlpha *= a; c.translate(x, y); c.rotate(rot); c.scale(s, s);
  const blob = (bx, by, r, col) => { const g = c.createRadialGradient(bx - r * .35, by - r * .35, r * .1, bx, by, r); g.addColorStop(0, '#5E7E70'); g.addColorStop(1, col); c.fillStyle = g; c.beginPath(); c.arc(bx, by, r, 0, 6.283); c.fill(); };
  blob(-3.5, 1, 5.2, K.green); blob(3, -2, 4.6, K.greenMid); blob(2.5, 4, 3.6, K.green); c.restore();
}
function rbc(x, y, s, tilt) {
  c.save(); c.translate(x, y); c.rotate(tilt); c.scale(s, s);
  const g = c.createRadialGradient(0, 0, 2, 0, 0, 25); g.addColorStop(0, '#8A2F29'); g.addColorStop(.5, '#A2443B'); g.addColorStop(.82, '#B9584D'); g.addColorStop(1, '#93352E');
  c.fillStyle = g; c.beginPath(); c.ellipse(0, 0, 25, 11.5, 0, 0, 6.283); c.fill(); c.restore();
}
// Tarjeta con nombre del órgano y su mensaje, con línea guía
function card(name, effect, cx, cy, ax, ay, a) {
  if (a <= .01) return;
  c.save(); c.globalAlpha *= a;
  c.font = `600 36px ${SANS}`; const w1 = c.measureText(effect).width;
  c.font = `700 24px ${SANS}`; c.letterSpacing = '3px'; const w0 = c.measureText(name.toUpperCase()).width; c.letterSpacing = '0px';
  const w = Math.max(w0, w1) + 56, h = 112, x = cx - w / 2, y = cy - h / 2;
  c.strokeStyle = K.amber; c.lineWidth = 3; c.beginPath(); c.moveTo(ax, ay); c.lineTo(clamp(ax, x, x + w), cy); c.stroke();
  c.fillStyle = K.amber; c.beginPath(); c.arc(ax, ay, 7, 0, 6.283); c.fill();
  c.shadowColor = 'rgba(30,28,25,.14)'; c.shadowBlur = 24; c.shadowOffsetY = 6;
  c.fillStyle = K.white; rr(x, y, w, h, 18); c.fill(); c.shadowColor = 'transparent';
  c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  c.font = `700 24px ${SANS}`; c.letterSpacing = '3px'; c.fillStyle = K.amber; c.fillText(name.toUpperCase(), x + 28, y + 44); c.letterSpacing = '0px';
  c.font = `600 36px ${SANS}`; c.fillStyle = K.char; c.fillText(effect, x + 28, y + 90);
  c.restore();
}
function pill(text, cx, cy, a, bg = K.white, fg = K.char, size = 30) {
  if (a <= .01) return;
  c.save(); c.globalAlpha *= a; c.font = `600 ${size}px ${SANS}`; const w = c.measureText(text).width + size * 1.5, h = size * 1.9;
  c.fillStyle = bg; rr(cx - w / 2, cy - h / 2, w, h, h / 2); c.fill();
  c.fillStyle = fg; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(text, cx, cy + 2); c.restore();
}

// ── Cuerpo y órganos (coordenadas base: cabeza en y≈330, torso hasta y≈1220) ──
const ORG = { brain: [540, 318], liver: [476, 836], stomach: [604, 827], pancreas: [565, 909], gut: [546, 1057] };
// Ilustración del cuerpo (ElevenCreative): escala y posición para que el cerebro quede en ORG.brain
const BODY_IMG = new Image(); BODY_IMG.src = 'imagenes-ia/elegidas/cuerpo-recorte.png';   // fondo quitado con transparencia
const BS = .56, BX = 540 - 565 * BS, BY = 318 - 150 * BS;
const OEL = { brain: [540, 314, 86, 52, 0], liver: [476, 836, 84, 64, -.15], stomach: [606, 826, 62, 62, .4], pancreas: [566, 909, 88, 24, -.1], gut: [546, 1060, 118, 128, 0] };
function organPath(k) {
  c.beginPath();
  if (k === 'brain') { c.moveTo(468, 322); c.bezierCurveTo(462, 268, 510, 250, 545, 254); c.bezierCurveTo(590, 250, 622, 282, 614, 322); c.bezierCurveTo(612, 352, 585, 368, 560, 362); c.bezierCurveTo(552, 378, 528, 378, 522, 362); c.bezierCurveTo(492, 366, 470, 350, 468, 322); }
  if (k === 'stomach') { c.moveTo(572, 652); c.bezierCurveTo(640, 630, 722, 700, 702, 800); c.bezierCurveTo(690, 860, 622, 880, 578, 850); c.bezierCurveTo(552, 834, 562, 800, 586, 780); c.bezierCurveTo(606, 760, 578, 702, 572, 652); }
  if (k === 'liver') { c.moveTo(380, 692); c.bezierCurveTo(430, 642, 540, 650, 560, 692); c.bezierCurveTo(565, 742, 500, 790, 430, 800); c.bezierCurveTo(385, 800, 360, 742, 380, 692); }
  if (k === 'pancreas') { c.moveTo(455, 886); c.bezierCurveTo(470, 850, 560, 862, 690, 846); c.bezierCurveTo(706, 850, 702, 872, 686, 874); c.bezierCurveTo(600, 892, 520, 916, 480, 916); c.bezierCurveTo(455, 916, 445, 900, 455, 886); }
  c.closePath();
}
function gutPath() { c.beginPath(); [[430, 965], [650, 965], [650, 1015], [430, 1015], [430, 1065], [650, 1065], [650, 1115], [470, 1115]].forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); }
function drawBody(lit, t) {
  if (BODY_IMG.complete && BODY_IMG.naturalWidth) {
    c.drawImage(BODY_IMG, BX, BY, 1152 * BS, 2048 * BS);
  }
  // el órgano que recibe el mensaje se ilumina en ámbar
  for (const k of ['gut', 'pancreas', 'stomach', 'liver', 'brain']) {
    const L = lit[k] || 0; if (L <= .01) continue; const [x, y, rx, ry, rot] = OEL[k], pulse = 1 + Math.sin(t * 4) * .04;
    c.save(); c.translate(x, y); c.rotate(rot); c.scale(1, ry / rx);
    const g = c.createRadialGradient(0, 0, rx * .2, 0, 0, rx * 1.45 * pulse); g.addColorStop(0, `rgba(222,150,50,${.42 * L})`); g.addColorStop(.6, `rgba(222,150,50,${.22 * L})`); g.addColorStop(1, 'rgba(196,131,43,0)');
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, rx * 1.45 * pulse, 0, 6.283); c.fill();
    c.restore();
    c.save(); c.translate(x, y); c.rotate(rot); c.strokeStyle = `rgba(196,131,43,${.9 * L})`; c.lineWidth = 5; c.setLineDash([4, 10]); c.lineCap = 'round';
    c.beginPath(); c.ellipse(0, 0, rx * 1.08 * pulse, ry * 1.12 * pulse, 0, 0, 6.283); c.stroke(); c.restore();
  }
}
// Cámara: acercamiento suave al órgano que recibe el mensaje
const FOC = o => [540 + .4 * (ORG[o][0] - 540), 720 + .4 * (ORG[o][1] - 720), 1.14];
const CAMK = [[0, 540, 720, 1], [20.3, 540, 720, 1], [21.3, ...FOC('pancreas')], [26.9, ...FOC('pancreas')], [27.9, ...FOC('liver')], [31.9, ...FOC('liver')],
  [32.9, ...FOC('stomach')], [36.9, ...FOC('stomach')], [37.9, ...FOC('brain')], [41.2, ...FOC('brain')], [42, 540, 720, 1]];
function cam(t) { let i = 0; while (i < CAMK.length - 2 && t >= CAMK[i + 1][0]) i++; const a = CAMK[i], b = CAMK[i + 1], u = ease(clamp((t - a[0]) / (b[0] - a[0]), 0, 1)); return [lerp(a[1], b[1], u), lerp(a[2], b[2], u), lerp(a[3], b[3], u)]; }
let CARDQ = [];
const qcard = (...a) => CARDQ.push(a);
// partículas emitidas a un ritmo antes y otro después de un momento (determinista)
function births(t, s0, tArr, fast, slow, life) { const out = []; let k = 0; for (let b = s0; b < Math.min(t, tArr); b += fast, k++) if (t - b < life) out.push([(t - b) / life, k]); if (slow) for (let b = tArr + slow * .4; b < t; b += slow, k++) if (t - b < life) out.push([(t - b) / life, k]); return out; }
// mensajero que viaja hasta un órgano
function messenger(t, t0, from, to) { const p = prog(t, t0, 1.7); if (p <= 0 || t > t0 + 2.6) return; const e = ease(p); const x = lerp(from[0], to[0], e), y = lerp(from[1], to[1], e) - Math.sin(e * Math.PI) * 70; helix(x, y, lerp(4.2, 2.6, e), lerp(-.3, .2, e), 1 - prog(t, t0 + 1.9, .6), t * 6, true); }

// ── Escenas ───────────────────────────────────────────────────────────────
function sceneBodyFull(t) {
  const [ccx, ccy, ck] = cam(t), mx = x => 540 + (x - ccx) * ck, my = y => 720 + (y - ccy) * ck;
  CARDQ = [];
  c.save(); c.translate(540, 720); c.scale(ck, ck); c.translate(-ccx, -ccy);
  sceneBodyInner(t);
  c.restore();
  CARDQ.forEach(([n, e, x, y, ax, ay, a]) => card(n, e, x, y, mx(ax), my(ay), a));
}
function sceneBodyInner(t) {
  const lit = { gut: win(t, 2.6, 6.4), pancreas: t >= 20 ? lerp(.55, 1, win(t, 21.6, 27, .5)) * prog(t, 21.6, .5) : 0, liver: prog(t, 28.6, .5) * lerp(.55, 1, win(t, 28.6, 32, .5)), stomach: prog(t, 33.6, .5) * lerp(.55, 1, win(t, 33.6, 37, .5)), brain: prog(t, 38.6, .5) };

    const pa = prog(t, .2, .6);
    c.save(); c.globalAlpha *= pa; c.fillStyle = K.white; c.strokeStyle = K.char30; c.lineWidth = 4; c.beginPath(); c.arc(215, 330, 78, 0, 6.283); c.fill(); c.stroke(); c.beginPath(); c.arc(215, 330, 54, 0, 6.283); c.stroke();
    c.fillStyle = K.amber; c.beginPath(); c.arc(200, 320, 20, 0, 6.283); c.fill(); c.fillStyle = K.greenMid; c.beginPath(); c.arc(236, 344, 16, 0, 6.283); c.fill(); c.fillStyle = '#B9584D'; c.beginPath(); c.arc(226, 306, 11, 0, 6.283); c.fill(); c.restore();
    const f = prog(t, .9, 2.6);   // bocado que baja
    if (f > 0 && f < 1) { const pts = [[300, 330], [480, 430], [545, 470], [548, 560], [555, 680], [565, 772], [605, 822], [582, 867], [545, 935], [540, 985]]; const u = ease(f) * (pts.length - 1), i = Math.min(pts.length - 2, Math.floor(u)), v = u - i; c.fillStyle = K.amber; c.beginPath(); c.arc(lerp(pts[i][0], pts[i + 1][0], v), lerp(pts[i][1], pts[i + 1][1], v), 13, 0, 6.283); c.fill(); }

    qcard('Intestino', 'suelta GLP-1', 190, 1100, 440, 1057, prog(t, 3.2, .5));
  }
  if (t >= 19.5) {
    const from = [40, 620];
    // Páncreas
    messenger(t, 20.2, from, ORG.pancreas);
    if (t > 21.8 && t < 42.6) births(t, 21.8, 99, .5, 0, 1.8).forEach(([a, k]) => { const ang = -.5 + ((k % 4) - 1.5) * .28, d = easeOut(a) * 190; insulin(620 + Math.cos(ang) * d, 905 + Math.sin(ang) * d - 20 * a, 2.4, k, (a < .15 ? a / .15 : 1 - prog(a, .65, .35)) * (t < 27 ? 1 : .0)); });
    qcard('Páncreas', 'más insulina', 880, 1000, 645, 905, win(t, 22, 42.5));
    // Hígado
    messenger(t, 27.2, from, ORG.liver);
    if (t > 26.6 && t < 32.4) births(t, 26.6, 28.9, .42, 1.7, 2).forEach(([a, k]) => { const ang = Math.PI + .5 - ((k % 3) - 1) * .35, d = easeOut(a) * 200; hex(430 + Math.cos(ang) * d, 830 + Math.sin(ang) * d, 2.6, k + a, a < .15 ? a / .15 : 1 - prog(a, .65, .35)); });
    qcard('Hígado', 'menos azúcar', 196, 640, 410, 815, win(t, 29, 42.5));
    // Estómago
    messenger(t, 32.2, from, ORG.stomach);
    if (t > 31.6 && t < 37.4) births(t, 31.6, 33.9, .34, 1.4, 1.5).forEach(([a]) => { c.save(); c.globalAlpha *= a < .15 ? a / .15 : 1 - prog(a, .7, .3); c.fillStyle = K.amber; c.beginPath(); c.arc(lerp(590, 548, a), lerp(860, 985, ease(a)), 10, 0, 6.283); c.fill(); c.restore(); });
    qcard('Estómago', 'más despacio', 900, 760, 655, 810, win(t, 34, 42.5));
    // Cerebro
    messenger(t, 37.2, from, ORG.brain);
    qcard('Cerebro', 'menos apetito', 870, 250, 618, 318, win(t, 39, 42.5));
  }
}
function sceneVessel(t) {
  const top = 520, bot = 900;
  if (!window.NH3D) {
