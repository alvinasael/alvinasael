const SIN = [
  (t, y) => { iconRx(400, y, 1.5, K.char60); [[560, y - 80], [640, y], [560, y + 80], [700, y - 100], [720, y + 90]].forEach(([x, yy], i) => { const s = pop(t, 4.6 + i * .25); if (s > 0) { c.save(); scaleAt(x, yy, s); iconQ(x, yy, 30, K.char60); c.restore(); } }); },
  (t, y) => { iconMoon(270, y - 90, 1.2, K.char60); c.fillStyle = K.char; rr(360, y - 150, 380, 300, 28); c.fill();
    bubble(550, y - 70, 340, 'Come esto', K.char, K.creamDark, prog(t, 14, .4)); bubble(550, y + 10, 340, 'Nunca comas esto', K.char, K.creamDark, prog(t, 14.8, .4)); bubble(550, y + 90, 340, '¿Cuál es?', K.white, K.char60, prog(t, 15.6, .4)); },
  (t, y) => { c.fillStyle = K.white; rr(300, y - 150, 220, 300, 14); c.fill(); label('Prohibido', 410, y - 100, K.char60, 'center', 22); [0, 1, 2, 3].forEach(i => { c.fillStyle = K.char30; c.fillRect(330, y - 60 + i * 50, 160, 8); });

  (t, y) => { iconMeter(450, y, 1.6, String(Math.round(lerp(120, 187, ease(prog(t, 32, 1.5)))))); [[600, y - 60], [650, y + 30]].forEach(([x, yy], i) => { const s = pop(t, 33.3 + i * .4); if (s > 0) { c.save(); scaleAt(x, yy, s); iconQ(x, yy, 30, K.char60); c.restore(); } }); },

    iconPerson(830, y, 1.6, K.char60); txt('sin apoyo', 830, y + 110, `600 28px ${SANS}`, K.char60); },

];
const CON = [

function meter(x, y, v, col, name) { c.fillStyle = 'rgba(0,0,0,.06)'; rr(x, y, 300, 22, 11); c.fill(); c.fillStyle = col; rr(x, y, Math.max(22, 300 * v), 22, 11); c.fill(); txt(name, x, y - 14, `600 24px ${SANS}`, col, 'left'); }
function sceneSplit(t) {

  const blend = (arr, idx, at) => lerp(arr[Math.max(0, idx - 1)], arr[idx], ease(prog(t, at, .8)));
  const vSin = blend(CONF_SIN, Math.min(kin, 6), mm[1]), vCon = blend(CONF_CON, Math.min(kcon, 6), mm[2]);
  const fin = prog(t, ENDM, .8);
  // paneles
  c.fillStyle = '#E6E2DB'; rr(60, 160, 960, 610, 32); c.fill(); shadowCard(60, 810, 960, 610, 32);
  label('Sin acompañamiento', 110, 222, K.char60); label('Con Nutrición.Health', 110, 872, K.amber);
  meter(680, 205, vSin, K.char60, 'Confianza'); meter(680, 855, vCon, K.amber, 'Confianza');
  // momento actual (con cruce suave al cambiar)
  M.forEach(([a, sAt, cAt, title], i) => { const next = M[i + 1] ? M[i + 1][0] - .3 : ENDM; const al = win(t, a - .2, next, .35); if (al <= 0) return;
    const sa = easeOut(prog(t, sAt, .5)), ca = easeOut(prog(t, cAt, .5));
    c.save(); c.globalAlpha *= al * sa; c.translate(0, (1 - sa) * 30); SIN[i](t, 490); c.restore();
    if (ca > 0) { c.save(); c.globalAlpha *= al * ca; c.translate(0, (1 - ca) * 30); CON[i](t, 1140); c.restore(); }
    else { c.save(); c.globalAlpha *= al * .5; txt('…', 540, 1150, `700 80px ${SERIF}`, K.char30); c.restore(); }
    c.save(); c.globalAlpha *= al; pill(`${i + 1} · ${title}`, 540, 790, 1, K.green, K.white, 30); c.restore(); });
  // final: la misma diabetes, dos experiencias
  if (fin > 0) { c.save(); c.globalAlpha *= fin;
    txt('La misma diabetes.', 540, 470, `400 62px ${SERIF}`, K.char60); const b = easeOut(prog(t, 61.3, .7)); c.globalAlpha *= 1; c.save(); c.globalAlpha *= b; txt('Dos experiencias.', 540, 1120, `600 66px ${SERIF}`, K.green); c.restore();
    c.restore(); }
}

function captions(t) {   // subtítulo: cada línea con su franja blanca semitransparente
  CAPS.forEach(([a, b, text, strong]) => { const al = win(t, a, b + .25, .3); if (al <= 0) return;
    c.save(); c.globalAlpha = al; c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = strong ? `600 54px ${SERIF}` : `600 44px ${SANS}`;
    const lines = wrap(text, 920), lh = strong ? 74 : 64, yb = 1700 - (lines.length - 1) * lh;
    lines.forEach((l, i) => { const w = c.measureText(l).width + 36, y = yb + i * lh; c.fillStyle = 'rgba(255,255,255,.82)'; rr(540 - w / 2, y - lh / 2 + 4, w, lh - 8, 10); c.fill(); });
    c.fillStyle = strong ? K.green : K.char; lines.forEach((l, i) => c.fillText(l, 540, yb + i * lh + 2)); c.restore(); });
}

const SC = [[0, 64.35, sceneSplit], [64.35, 68.65, t => scene8(t - 11)], [68.65, 73.1, t => scene9(t - 11.1)]];
function renderAt(t) {

  c.fillStyle = K.creamDark; c.fillRect(0, 0, W, 10); c.fillStyle = K.amber; c.fillRect(0, 0, W * t / TOTAL, 10);

    c.fillStyle = K.amber; c.fillRect(500, 800, 80, 6); txt('Nutrición.Health', 540, 940, `400 92px ${SERIF}`, K.white); txt('Más allá del consultorio.', 540, 1020, `italic 400 42px ${SERIF}`, K.greenLight);

}
window.renderAt = renderAt; window.renderFrame = renderAt; window.DUR = TOTAL; window.prepare = () => Promise.resolve();
