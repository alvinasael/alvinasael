<!DOCTYPE html>

<style>

<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Video vertical 1080×1920 sobre la metodología del programa. Todo es función del tiempo: renderAt(t).
const W = 1080, H = 1920, TOTAL = 66;
const cv = document.getElementById('c'), c = cv.getContext('2d');
const K = { green: '#2B4038', greenMid: '#3D5C4F', greenLight: '#D4E4DD', greenPale: '#EBF3EF', cream: '#F7F3ED', creamDark: '#EDE8DF',
  amber: '#C4832B', amberLight: '#F5E8D6', char: '#1E1C19', char60: '#6B6760', char30: '#C2C0BC', white: '#FFFFFF' };
const SANS = '"DM Sans", system-ui, sans-serif', SERIF = '"Playfair Display", Georgia, serif';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2, easeOut = t => 1 - Math.pow(1 - t, 3);
const prog = (t, s, d) => clamp((t - s) / d, 0, 1);
const win = (t, a, b, f = .45) => Math.min(prog(t, a, f), 1 - prog(t, b - f, f));
const pop = (t, s, d = .45) => { const p = prog(t, s, d); return p <= 0 ? 0 : 1 + Math.sin(p * Math.PI) * .12 * (1 - p) + (easeOut(p) - 1); };

// ── Guion: [inicio, fin, texto, destacado] (tiempos = voz en voz/m1..m9.mp3) ──
const CAPS = [
  [0.5, 5.9, 'Tu cita con el médico dura unos quince minutos. ¿Te alcanza para entender tu diabetes?'],
  [6.4, 12.5, 'Por eso nuestro enfoque es completo. Te acompañamos de tres formas, conectadas entre sí.', 1],
  [13.0, 18.2, 'En tu consulta individual, Giovanna evalúa tu caso y crea tu plan de alimentación.'],
  [18.6, 25.4, 'En el programa aprendes a vivir con tu diabetes: ocho sesiones en grupo pequeño, por Zoom y en español.'],
  [25.9, 34.9, 'Aprendes a leer tu glucómetro y a entender tus números. A comer sin renunciar a tu comida. Y tienes tiempo de verdad para preguntar todo.'],
  [35.4, 40.4, 'Y tu médico recibe tu progreso, para que todo trabaje en la misma dirección.'],
  [40.9, 47.0, 'Las guía Giovanna Gierbolini, nutricionista-dietista registrada y especialista en diabetes.'],
  [47.5, 53.2, 'Tu médico trata la enfermedad. Nosotros te enseñamos a vivir con ella, todos los días.'],
  [58.0, 61.9, '¿Quieres ser de los primeros? Regístrate y te avisamos.', 1],
];
const SC = [[0, 6.15], [6.15, 40.65], [40.65, 47.25], [47.25, 53.45], [53.45, 57.75], [57.75, 62.2]];

// ── Primitivas ────────────────────────────────────────────────────────────
function rr(x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function wrap(text, maxW) { const ws = text.split(' '), out = []; let cur = ''; for (const w of ws) { const t = cur ? cur + ' ' + w : w; if (c.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; } if (cur) out.push(cur); return out; }
function pill(text, cx, cy, a, bg = K.white, fg = K.char, size = 30) {
  if (a <= .01) return; c.save(); c.globalAlpha *= a; c.font = `600 ${size}px ${SANS}`; const w = c.measureText(text).width + size * 1.5, h = size * 1.9;
  c.fillStyle = bg; rr(cx - w / 2, cy - h / 2, w, h, h / 2); c.fill(); c.fillStyle = fg; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(text, cx, cy + 2); c.restore();
}
function shadowCard(x, y, w, h, r = 28, fill = K.white) { c.save(); c.shadowColor = 'rgba(30,28,25,.10)'; c.shadowBlur = 30; c.shadowOffsetY = 8; c.fillStyle = fill; rr(x, y, w, h, r); c.fill(); c.restore(); }
function label(text, x, y, color = K.amber, align = 'left', size = 24) { c.font = `700 ${size}px ${SANS}`; c.letterSpacing = '4px'; c.fillStyle = color; c.textAlign = align; c.textBaseline = 'alphabetic'; c.fillText(text.toUpperCase(), x, y); c.letterSpacing = '0px'; }
function txt(text, x, y, font, color, align = 'center') { c.font = font; c.fillStyle = color; c.textAlign = align; c.textBaseline = 'alphabetic'; c.fillText(text, x, y); }
function scaleAt(x, y, s) { c.translate(x, y); c.scale(s, s); c.translate(-x, -y); }
function circ(x, y, r, fill) { c.fillStyle = fill; c.beginPath(); c.arc(x, y, r, 0, 6.283); c.fill(); }
// Íconos de línea (estilo uniforme: trazo redondeado)
function stroke(col = K.green, w = 7) { c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round'; c.lineJoin = 'round'; }
function iconPerson(x, y, s, col) { c.save(); c.translate(x, y); c.scale(s, s); circ(0, -22, 14, col); c.fillStyle = col; c.beginPath(); c.moveTo(-26, 30); c.quadraticCurveTo(-26, -2, 0, -2); c.quadraticCurveTo(26, -2, 26, 30); c.closePath(); c.fill(); c.restore(); }
function iconSteth(x, y, s, col = K.green) { c.save(); c.translate(x, y); c.scale(s, s); stroke(col, 7);
  c.beginPath(); c.moveTo(-26, -36); c.lineTo(-26, -6); c.quadraticCurveTo(-26, 18, 0, 18); c.quadraticCurveTo(26, 18, 26, -6); c.lineTo(26, -36); c.stroke();
  c.beginPath(); c.moveTo(0, 18); c.lineTo(0, 30); c.quadraticCurveTo(0, 46, 22, 46); c.quadraticCurveTo(42, 46, 42, 28); c.stroke(); circ(42, 20, 11, col); circ(42, 20, 5, K.white); c.restore(); }
function iconHouse(x, y, s, col = K.green) { c.save(); c.translate(x, y); c.scale(s, s); stroke(col, 7);
  c.beginPath(); c.moveTo(-40, -2); c.lineTo(0, -38); c.lineTo(40, -2); c.stroke(); c.beginPath(); c.moveTo(-30, -10); c.lineTo(-30, 38); c.lineTo(30, 38); c.lineTo(30, -10); c.stroke();
  c.fillStyle = K.amber; c.beginPath(); c.moveTo(0, 30); c.bezierCurveTo(-22, 14, -16, -6, 0, 4); c.bezierCurveTo(16, -6, 22, 14, 0, 30); c.fill(); c.restore(); }
function iconCard(x, y, s) { c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = K.white; c.strokeStyle = K.green; c.lineWidth = 6; rr(-46, -30, 92, 60, 10); c.fill(); c.stroke();
  c.fillStyle = K.amber; c.fillRect(-46, -30, 92, 14); c.fillStyle = K.char30; c.fillRect(-34, -2, 50, 6); c.fillRect(-34, 12, 34, 6); c.restore(); }
function iconPhone(x, y, s) { c.save(); c.translate(x, y); c.scale(s, s); stroke(K.green, 6); rr(-24, -40, 48, 80, 10); c.stroke(); circ(0, 30, 4, K.green);
  c.fillStyle = K.amber; c.beginPath(); c.arc(22, -30, 16, 0, 6.283); c.fill(); stroke(K.white, 4); c.beginPath(); c.moveTo(15, -30); c.lineTo(29, -30); c.moveTo(22, -37); c.lineTo(22, -23); c.stroke(); c.restore(); }
function iconVideo(x, y, s) { c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = K.green; rr(-46, -32, 92, 64, 10); c.fill();
  for (let i = 0; i < 6; i++) { const cx = -28 + (i % 3) * 28, cy = -14 + Math.floor(i / 3) * 28; c.fillStyle = K.greenMid; rr(cx - 12, cy - 11, 24, 22, 4); c.fill(); circ(cx, cy - 3, 4, K.greenLight); } c.restore(); }
function iconReport(x, y, s) { c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = K.white; c.strokeStyle = K.green; c.lineWidth = 6; rr(-32, -42, 64, 84, 8); c.fill(); c.stroke();
  stroke(K.amber, 6); c.beginPath(); c.moveTo(-18, 14); c.lineTo(-6, 0); c.lineTo(6, 8); c.lineTo(20, -14); c.stroke(); c.fillStyle = K.char30; c.fillRect(-18, -28, 36, 5); c.fillRect(-18, 24, 26, 5); c.restore(); }
function iconMeter(x, y, s, val) { c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = K.green; rr(-44, -62, 88, 124, 22); c.fill();
  c.fillStyle = K.greenPale; rr(-32, -48, 64, 46, 8); c.fill(); c.font = `700 30px ${SANS}`; c.fillStyle = K.green; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(val, 0, -22);
  c.font = `600 11px ${SANS}`; c.fillText('mg/dL', 0, -6 + 2); circ(-14, 30, 9, K.greenMid); circ(14, 30, 9, K.greenMid); c.fillStyle = K.amber; rr(-8, 54, 16, 26, 4); c.fill(); c.restore(); }
function iconPlate(x, y, s) { c.save(); c.translate(x, y); c.scale(s, s); circ(0, 0, 56, K.white); c.strokeStyle = K.creamDark; c.lineWidth = 4; c.beginPath(); c.arc(0, 0, 56, 0, 6.283); c.stroke();
  c.fillStyle = '#F4EFE6'; c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, 44, Math.PI * .5, Math.PI * 1.5); c.fill();   // arroz
  c.fillStyle = '#9C5A3C'; for (let i = 0; i < 9; i++) { const a = Math.PI * .6 + i * .32, r = 14 + (i % 3) * 9; c.beginPath(); c.ellipse(Math.cos(a) * r, Math.sin(a) * r, 6, 4, a, 0, 6.283); c.fill(); }   // habichuelas
  c.fillStyle = K.greenMid; c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, 44, -Math.PI * .5, Math.PI * .05); c.fill();   // ensalada
  c.fillStyle = '#D8A84E'; c.beginPath(); c.ellipse(22, 24, 16, 12, .4, 0, 6.283); c.fill(); c.restore(); }   // tostón
function iconChat(x, y, s) { c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = K.green; rr(-50, -40, 70, 48, 14); c.fill(); c.beginPath(); c.moveTo(-36, 6); c.lineTo(-40, 22); c.lineTo(-22, 6); c.fill();
  c.fillStyle = K.amber; rr(-10, -6, 64, 44, 14); c.fill(); c.beginPath(); c.moveTo(38, 36); c.lineTo(44, 52); c.lineTo(24, 36); c.fill();
  c.font = `700 30px ${SERIF}`; c.fillStyle = K.white; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', -15, -15); c.fillText('!', 22, 16); c.restore(); }

// ── Escenas ───────────────────────────────────────────────────────────────
function scene1(t) {   // 15 minutos no alcanzan
  const cx = 540, cy = 640, R = 250, p = ease(prog(t, .7, 2.6));
  c.save(); scaleAt(cx, cy, .9 + .1 * easeOut(prog(t, 0, .8)));
  shadowCard(cx - R - 40, cy - R - 40, (R + 40) * 2, (R + 40) * 2, R + 40);
  c.strokeStyle = K.creamDark; c.lineWidth = 26; c.beginPath(); c.arc(cx, cy, R - 30, 0, 6.283); c.stroke();
  c.strokeStyle = K.amber; c.lineCap = 'round'; c.beginPath(); c.arc(cx, cy, R - 30, -Math.PI / 2, -Math.PI / 2 + p * Math.PI / 2); c.stroke();   // 15 de 60 min
  for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; c.strokeStyle = K.char30; c.lineWidth = 5; c.beginPath(); c.moveTo(cx + Math.cos(a) * (R - 64), cy + Math.sin(a) * (R - 64)); c.lineTo(cx + Math.cos(a) * (R - 80), cy + Math.sin(a) * (R - 80)); c.stroke(); }
  const ang = -Math.PI / 2 + p * Math.PI / 2; stroke(K.char, 10); c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.cos(ang) * (R - 96), cy + Math.sin(ang) * (R - 96)); c.stroke(); circ(cx, cy, 14, K.char);
  c.restore();
  txt(`${Math.round(p * 15)} min`, 540, 1060, `700 92px ${SERIF}`, K.amber);
  txt('por consulta¹', 540, 1110, `500 32px ${SANS}`, K.char60);
  // preguntas que no caben
  const Q = [[250, 420], [830, 450], [190, 760], [880, 800], [300, 960], [790, 1010], [540, 300]];
  Q.forEach(([x, y], i) => { const s = pop(t, 3.7 + i * .22); if (s <= 0) return; c.save(); c.globalAlpha *= Math.min(1, s); scaleAt(x, y, s);
    circ(x, y, 38, i % 2 ? K.green : K.amber); txt('?', x, y + 18, `700 52px ${SERIF}`, K.white); c.restore(); });
}
function scene2(t) {   // médico trata · nosotros enseñamos a vivir con ella
  const a1 = easeOut(prog(t, 6.4, .6)), a2 = easeOut(prog(t, 8.6, .6));
  c.save(); c.globalAlpha *= a1; c.translate(0, (1 - a1) * 40);
  shadowCard(120, 300, 840, 300); iconSteth(260, 450, 1.7);
  label('Tu médico', 380, 410); txt('trata la', 380, 480, `400 54px ${SERIF}`, K.char, 'left'); txt('enfermedad', 380, 545, `400 54px ${SERIF}`, K.char, 'left'); c.restore();
  c.save(); c.globalAlpha *= a2; c.translate(0, (1 - a2) * 40);
  shadowCard(120, 650, 840, 300, 28, K.green); iconHouse(260, 800, 1.7, K.greenLight);
  label('Nosotros', 380, 760, K.amber); txt('te enseñamos a', 380, 830, `400 54px ${SERIF}`, K.white, 'left'); txt('vivir con ella', 380, 895, `400 54px ${SERIF}`, K.white, 'left'); c.restore();
  const days = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
  days.forEach((d, i) => { const f = prog(t, 10.7 + i * .16, .3), x = 540 + (i - 3) * 118; if (f <= 0) return;
    c.save(); c.globalAlpha *= f; c.fillStyle = K.amber; rr(x - 48, 1010, 96, 96, 20); c.fill(); txt(d, x, 1074, `700 40px ${SANS}`, K.white); c.restore(); });
  txt('todos los días', 540, 1170, `600 32px ${SANS}`, K.char60); c.globalAlpha *= 1;
}
function scene3(t) {   // 8 sesiones · 10 personas · Zoom · casa · español
  label('El programa', 540, 270, K.amber, 'center');
  for (let i = 0; i < 8; i++) { const f = pop(t, 13.4 + i * .2, .4), x = 540 + ((i % 4) - 1.5) * 190, y = 380 + Math.floor(i / 4) * 150; if (f <= 0) continue;
    c.save(); scaleAt(x, y, f); circ(x, y, 58, K.green); txt(String(i + 1), x, y + 16, `600 46px ${SERIF}`, K.white); c.restore(); }
  pill('8 sesiones · 60 minutos cada una', 540, 690, easeOut(prog(t, 14.6, .5)), K.amber, K.white, 32);
  // teléfono con videollamada de 10
  const pa = easeOut(prog(t, 15.4, .6)); if (pa > 0) { c.save(); c.globalAlpha *= pa; c.translate(0, (1 - pa) * 50);
    c.fillStyle = K.char; rr(250, 780, 580, 560, 46); c.fill(); c.fillStyle = '#2E2B27'; rr(272, 802, 536, 516, 32); c.fill();
    for (let i = 0; i < 10; i++) { const f = prog(t, 15.8 + i * .2, .35), x = 300 + (i % 2) * 245, y = 820 + Math.floor(i / 2) * 98; if (f <= 0) continue;
      c.save(); c.globalAlpha *= f; c.fillStyle = i === 0 ? K.amber : K.greenMid; rr(x, y, 233, 88, 12); c.fill(); iconPerson(x + 116, y + 50, .95, i === 0 ? K.white : K.greenLight); c.restore(); }
    c.restore(); }
  pill('máx. 10 personas', 540, 1385, easeOut(prog(t, 17.3, .5)), K.green, K.white, 30);
  [['Por Zoom', 18.7], ['Desde tu casa', 19.4], ['100% en español', 20.2]].forEach(([s, at], i) => pill(s, 540 + (i - 1) * 300, 1480, easeOut(prog(t, at, .45)), K.white, K.green, 30));
}
function scene4(t) {   // Giovanna
  const a = easeOut(prog(t, 21.9, .7)); c.save(); c.globalAlpha *= a; c.translate(0, (1 - a) * 40);
  shadowCard(110, 330, 860, 900, 36);
  circ(540, 560, 150, K.green); c.strokeStyle = K.amber; c.lineWidth = 8; c.beginPath(); c.arc(540, 560, 162, -Math.PI / 2, -Math.PI / 2 + 6.283 * ease(prog(t, 22.2, 1.6))); c.stroke();
  txt('GG', 540, 600, `400 110px ${SERIF}`, K.white);
  txt('Giovanna Gierbolini', 540, 820, `600 62px ${SERIF}`, K.char); txt('Rodríguez', 540, 890, `600 62px ${SERIF}`, K.char);
  txt('Nutricionista-Dietista Registrada', 540, 960, `500 34px ${SANS}`, K.char60); c.restore();
  [['RDN', 24.3], ['DSMES', 25.1], ['Credencial Medicare', 25.9]].forEach(([s, at], i) => { const f = pop(t, at); if (f <= 0) return; const x = 540, y = 1050 + i * 0;
    c.save(); const xs = [290, 430, 680][i]; scaleAt(xs, 1060, f); pill(s, xs, 1060, Math.min(1, f), i ? K.greenPale : K.amber, i ? K.green : K.white, 28); c.restore(); });
  pill('Especialista en diabetes', 540, 1150, easeOut(prog(t, 26.6, .5)), K.green, K.white, 30);
}
function scene5(t) {   // qué aprendes
  label('Lo que aprendes', 540, 270, K.amber, 'center');
  const rows = [[28.6, 'Leer tu glucómetro', 'y entender tus números', (x, y, s) => iconMeter(x, y, s, String(Math.round(lerp(180, 112, ease(prog(t, 29.2, 2))))))],
    [32.2, 'Comer sin renunciar', 'a tu comida', (x, y, s) => iconPlate(x, y, s)], [34.6, 'Tiempo de verdad', 'para preguntar todo', (x, y, s) => iconChat(x, y, s)]];
  rows.forEach(([at, l1, l2, ic], i) => { const a = easeOut(prog(t, at, .6)); if (a <= 0) return; const y = 360 + i * 330;
    c.save(); c.globalAlpha *= a; c.translate((1 - a) * 80, 0); shadowCard(110, y, 860, 270); circ(270, y + 135, 100, i === 1 ? K.amberLight : K.greenPale);
    ic(270, y + 135, 1.25); txt(l1, 420, y + 125, `600 50px ${SERIF}`, K.char, 'left'); txt(l2, 420, y + 185, `500 34px ${SANS}`, K.char60, 'left'); c.restore(); });
}
function scene6(t) {   // 4 pasos
  label('Cómo funciona', 540, 270, K.amber, 'center');
  const S = [[38.85, 'Tu médico te da', 'la tarjeta de referido', iconCard], [42.9, 'Tú nos contactas', 'teléfono, WhatsApp o web', iconPhone],
    [44.5, 'Te unes al grupo', 'por Zoom, desde tu casa', iconVideo], [45.8, 'Tu médico recibe', 'un resumen de tu progreso', iconReport]];
  const y0 = 350, dy = 270;
  c.strokeStyle = K.creamDark; c.lineWidth = 8; c.beginPath(); c.moveTo(200, y0 + 100); c.lineTo(200, y0 + 100 + 3 * dy); c.stroke();
  const lp = S.reduce((m, s, i) => t > s[0] ? i : m, -1); if (lp > 0) { c.strokeStyle = K.amber; c.beginPath(); c.moveTo(200, y0 + 100); c.lineTo(200, y0 + 100 + dy * (lp - 1 + ease(prog(t, S[lp][0], .6)))); c.stroke(); }
  S.forEach(([at, l1, l2, ic], i) => { const a = easeOut(prog(t, at, .55)); if (a <= 0) return; const y = y0 + i * dy;
    c.save(); c.globalAlpha *= a; c.translate((1 - a) * 60, 0); shadowCard(300, y + 10, 670, 180, 24);
    ic(400, y + 100, 1.1); txt(l1, 490, y + 92, `600 44px ${SERIF}`, K.char, 'left'); txt(l2, 490, y + 142, `500 30px ${SANS}`, K.char60, 'left'); c.restore();
    const s = pop(t, at); c.save(); scaleAt(200, y + 100, s); circ(200, y + 100, 44, K.amber); txt(String(i + 1), 200, y + 116, `700 44px ${SANS}`, K.white); c.restore(); });
  // el resumen regresa al médico (paso 4 → paso 1)
  const r = ease(prog(t, 46.6, 1.4)); if (r > 0) { c.save(); c.strokeStyle = K.green; c.lineWidth = 6; c.setLineDash([4, 14]); c.lineCap = 'round'; c.beginPath();
    const y1 = y0 + 3 * dy + 100, y2 = y0 + 100; for (let i = 0; i <= 60 * r; i++) { const u = i / 60, y = lerp(y1, y2, u), x = 990 + Math.sin(u * Math.PI) * 50; i ? c.lineTo(x, y) : c.moveTo(x, y); } c.stroke(); c.setLineDash([]);
    if (r >= 1) { c.fillStyle = K.green; c.beginPath(); c.moveTo(990, y2 - 16); c.lineTo(976, y2 + 8); c.lineTo(1004, y2 + 8); c.fill(); } c.restore(); }
}
function scene7(t) {   // complementamos
  const a1 = pop(t, 49.3), a2 = pop(t, 51.5), j = ease(prog(t, 51.5, .9));
  const x1 = lerp(540, 330, j), x2 = lerp(540, 750, j), y = 640;
  if (a2 > 0) { c.save(); c.globalAlpha *= Math.min(1, a2); c.strokeStyle = K.amber; c.lineWidth = 10; c.lineCap = 'round'; c.beginPath(); c.moveTo(x1 + 150, y); c.lineTo(x2 - 150, y); c.stroke();
    circ(540, y, 40, K.amber); txt('+', 540, y + 20, `700 60px ${SANS}`, K.white); c.restore(); }
  if (a1 > 0) { c.save(); scaleAt(x1, y, a1); circ(x1, y, 150, K.white); c.strokeStyle = K.green; c.lineWidth = 6; c.beginPath(); c.arc(x1, y, 150, 0, 6.283); c.stroke(); iconSteth(x1, y - 20, 1.9); c.restore(); txt('Tu médico', x1, y + 220, `600 40px ${SERIF}`, K.char); }
  if (a2 > 0) { c.save(); scaleAt(x2, y, a2); circ(x2, y, 150, K.green); iconHouse(x2, y - 10, 1.9, K.greenLight); c.restore(); txt('Nosotros', x2, y + 220, `600 40px ${SERIF}`, K.char); }
  const s = easeOut(prog(t, 52.2, .6)); if (s > 0) { c.save(); c.globalAlpha *= s; shadowCard(170, 1020, 740, 230, 28, K.green);
    txt('–1.0%', 540, 1130, `700 92px ${SERIF}`, K.amber); txt('HbA1c en promedio con educación estructurada¹', 540, 1200, `500 28px ${SANS}`, K.greenLight); c.restore(); }
}
