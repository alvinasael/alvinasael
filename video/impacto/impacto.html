const T = D.T, X = D.X, CAPS = D.CAPS, S = k => T[k][0], EN = k => T[k][1], TOTAL = D.total;
const W = 1080, H = 1920;
const cv = document.getElementById('c'), c = cv.getContext('2d');
const K = { green: '#2B4038', greenMid: '#3D5C4F', greenLight: '#D4E4DD', greenPale: '#EBF3EF', cream: '#F7F3ED', creamDark: '#EDE8DF',

// ── Primitivas ────────────────────────────────────────────────────────────
function rr(x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }

function pill(text, cx, cy, a, bg = K.white, fg = K.char, size = 30) {

}

function iconLife(x, y, s, col) { c.save(); c.translate(x, y); c.scale(s, s); circ(0, -22, 14, col); c.fillStyle = col; c.beginPath(); c.moveTo(-26, 30); c.quadraticCurveTo(-26, -2, 0, -2); c.quadraticCurveTo(26, -2, 26, 30); c.closePath(); c.fill(); c.restore(); }

function iconSign(x, y, s, col) { c.save(); c.translate(x, y); c.scale(s, s); stroke(col, 6); c.beginPath(); c.moveTo(0, -34); c.lineTo(0, 36); c.stroke(); c.fillStyle = col; c.beginPath(); c.moveTo(-4, -28); c.lineTo(30, -28); c.lineTo(40, -18); c.lineTo(30, -8); c.lineTo(-4, -8); c.fill(); c.beginPath(); c.moveTo(4, 0); c.lineTo(-30, 0); c.lineTo(-40, 10); c.lineTo(-30, 20); c.lineTo(4, 20); c.fill(); c.restore(); }
function iconLoop(x, y, s, col) { c.save(); c.translate(x, y); c.scale(s, s); stroke(col, 7); c.beginPath(); c.arc(0, 0, 28, -.3, 4.6); c.stroke(); c.fillStyle = col; c.beginPath(); c.moveTo(26, -22); c.lineTo(40, -2); c.lineTo(16, 0); c.fill(); c.restore(); }
function iconCheck(x, y, r) { circ(x, y, r, K.amber); stroke(K.white, r / 4); c.beginPath(); c.moveTo(x - r * .42, y); c.lineTo(x - r * .1, y + r * .32); c.lineTo(x + r * .45, y - r * .32); c.stroke(); }
// Medidor de A1c: arco de 5% a 10%, con zona meta
function gauge(cx, cy, R, val, a = 1) {
  c.save(); c.globalAlpha *= a; const A0 = Math.PI * .8, A1 = Math.PI * 2.2, ang = v => lerp(A0, A1, clamp((v - 5) / 5, 0, 1));
  c.lineCap = 'butt'; [[5, 7, K.greenLight], [7, 8, K.amberLight], [8, 10, K.redPale]].forEach(([a, b, col]) => { c.strokeStyle = col; c.lineWidth = 46; c.beginPath(); c.arc(cx, cy, R, ang(a), ang(b)); c.stroke(); });
  c.strokeStyle = val > 8 ? K.red : val > 7 ? K.amber : K.green; c.lineWidth = 46; c.beginPath(); c.arc(cx, cy, R, A0, ang(val)); c.stroke();
  const p = ang(val); circ(cx + Math.cos(p) * R, cy + Math.sin(p) * R, 34, K.white); circ(cx + Math.cos(p) * R, cy + Math.sin(p) * R, 22, K.char);
  [5, 6, 7, 8, 9, 10].forEach(v => txt(v + '%', cx + Math.cos(ang(v)) * (R + 70), cy + Math.sin(ang(v)) * (R + 70) + 10, `500 28px ${SANS}`, K.char60));
  txt(val.toFixed(1) + '%', cx, cy + 40, `700 150px ${SERIF}`, K.char); txt('A1c', cx, cy + 110, `600 40px ${SANS}`, K.char60); c.restore();
}

// ── Escenas ───────────────────────────────────────────────────────────────
function sceneHook(t) {   // Tu médico te habla de tu A1c… ¿cuánto puede cambiar un solo punto?
  const a = pop(t, S('g1') + .1, .7); c.save(); scaleAt(540, 700, a); c.globalAlpha *= Math.min(1, a);
  circ(540, 700, 300, K.white); c.strokeStyle = K.amber; c.lineWidth = 12; c.beginPath(); c.arc(540, 700, 300, -Math.PI / 2, -Math.PI / 2 + 6.283 * ease(prog(t, S('g1') + .3, 2.2))); c.stroke();
  txt('A1c', 540, 760, `700 200px ${SERIF}`, K.green); c.restore();
  const q = easeOut(prog(t, X.punto - .6, .6)); if (q > 0) { c.save(); c.globalAlpha *= q;
    txt('¿Cuánto cambia tu vida', 540, 1150 + (1 - q) * 30, `400 70px ${SERIF}`, K.char); txt('bajarla 1%?', 540, 1240 + (1 - q) * 30, `italic 400 74px ${SERIF}`, K.amber); c.restore(); }
}
function iconTube(x, y, s) { c.save(); c.translate(x, y); c.scale(s, s); c.rotate(.25);
  c.fillStyle = K.white; c.strokeStyle = K.green; c.lineWidth = 6; rr(-26, -80, 52, 170, [6, 6, 26, 26]); c.fill(); c.stroke();
  c.fillStyle = K.red; rr(-20, -10, 40, 94, [0, 0, 20, 20]); c.fill(); c.fillStyle = K.amber; rr(-32, -104, 64, 30, 8); c.fill(); c.restore(); }
function iconCalendar(x, y, s, t0, t) { c.save(); c.translate(x, y); c.scale(s, s);
  ['ENE', 'FEB', 'MAR'].forEach((m, i) => { const f = easeOut(prog(t, t0 + i * .3, .4)), cx = (i - 1) * 150; c.save(); c.globalAlpha *= Math.max(.25, f);
    c.fillStyle = K.white; c.strokeStyle = K.green; c.lineWidth = 5; rr(cx - 62, -70, 124, 150, 14); c.fill(); c.stroke(); c.fillStyle = f > .5 ? K.amber : K.char30; rr(cx - 62, -70, 124, 40, [14, 14, 0, 0]); c.fill();
    txt(m, cx, -40, `700 24px ${SANS}`, K.white); for (let d = 0; d < 12; d++) circ(cx - 39 + (d % 4) * 26, -2 + Math.floor(d / 4) * 26, 7, f > .5 ? K.greenMid : K.char30); c.restore(); });
  c.restore(); }
function sceneGauge(t) {   // análisis de sangre · promedio de 3 meses · no solo un día · parece poco
  const fA = win(t, S('g2') - .3, X.dia, .4);   // tarjetas: análisis + calendario
  if (fA > 0) { c.save(); c.globalAlpha *= fA;
    const a1 = easeOut(prog(t, S('g2') + .1, .5)); if (a1 > 0) { c.save(); c.globalAlpha *= a1; c.translate(0, (1 - a1) * 40); shadowCard(140, 300, 800, 360, 32);
      iconTube(330, 480, 1.1); txt('Análisis', 470, 470, `600 60px ${SERIF}`, K.char, 'left'); txt('de sangre', 470, 540, `italic 400 56px ${SERIF}`, K.amber, 'left'); c.restore(); }
    const a2 = easeOut(prog(t, X.promedio - .2, .5)); if (a2 > 0) { c.save(); c.globalAlpha *= a2; c.translate(0, (1 - a2) * 40); shadowCard(140, 720, 800, 520, 32);
      txt('Tu promedio de azúcar', 540, 810, `600 46px ${SERIF}`, K.char); iconCalendar(540, 1000, 1.3, X.meses - .3, t); txt('de los últimos 3 meses', 540, 1190, `500 36px ${SANS}`, K.char60); c.restore(); }
    c.restore(); }
  const fB = easeOut(prog(t, X.dia - .2, .6)); if (fB <= 0) return;   // medidor
  const v = lerp(8, 7, ease(prog(t, X.bajar, 1.8)));
  gauge(540, 760, 300, v, fB);
  pill('No solo lo de un día', 540, 330, fB, K.greenPale, K.green, 32);
  const d = pop(t, X.bajar + 1.5); if (d > 0) { c.save(); scaleAt(540, 1260, d); c.globalAlpha *= Math.min(1, d); pill('–1%', 540, 1260, 1, K.amber, K.white, 64); c.restore(); }
  const p = easeOut(prog(t, X.poco - .2, .5)); if (p > 0) { c.save(); c.globalAlpha *= p; txt('¿parece poco?', 540, 1420, `italic 400 56px ${SERIF}`, K.char60); c.restore(); }
}
const STATS = [['veintiun', '–21%', 'muertes relacionadas', 'con la diabetes', iconLife], ['catorce', '–14%', 'infartos', '', iconHeart],
  ['treinta7', '–37%', 'daño en ojos, riñones', 'y nervios', null], ['treinta4', '–34%', 'hospitalizaciones', '', iconHospital]];
function microIcons(x, y, s, col) { iconEye(x - 46 * s, y - 20 * s, .7 * s, col); iconKidney(x + 40 * s, y - 18 * s, .7 * s, col); iconNerve(x, y + 30 * s, .7 * s, col); }
function sceneImpact(t) {   // por cada 1% menos
  const h = easeOut(prog(t, X.porcada - .3, .6)); c.save(); c.globalAlpha *= h;
  label('Por cada', 540, 250, K.amber, 'center'); txt('1% menos de A1c', 540, 340, `600 70px ${SERIF}`, K.char); c.restore();
  STATS.forEach(([k, num, l1, l2, ic], i) => { const at = X[k] - .15, a = easeOut(prog(t, at, .55)); if (a <= 0) return; const y = 410 + i * 285;
    const on = t >= at && (i === 3 || t < X[STATS[i + 1][0]] - .15);
    c.save(); c.globalAlpha *= a; c.translate((1 - a) * 90, 0); shadowCard(90, y, 900, 245, 30, on ? K.green : K.white);
    circ(220, y + 122, 82, on ? K.greenMid : K.greenPale); ic ? ic(220, y + 122, 1.5, on ? K.white : K.green) : microIcons(220, y + 122, 1.05, on ? K.white : K.green);
    const n = Math.round(parseInt(num.slice(1)) * easeOut(prog(t, at, .9)));
    txt('–' + n + '%', 340, y + 120, `700 96px ${SERIF}`, on ? K.amber : K.amber, 'left');
    txt(l1, 340, y + 178, `500 36px ${SANS}`, on ? K.white : K.char, 'left'); if (l2) txt(l2, 340, y + 220, `500 36px ${SANS}`, on ? K.greenLight : K.char60, 'left'); c.restore(); });
}
function sceneQuestion(t) {   // ¿Y cómo se logra? (slide propio)
  c.fillStyle = K.green; c.fillRect(0, 0, W, H);
  const a = easeOut(prog(t, S('q') - .1, .7)); c.save(); c.globalAlpha *= a;
  c.fillStyle = K.amber; c.fillRect(500, 820, 80 * a, 6);
  txt('¿Y cómo bajamos', 540, 960 + (1 - a) * 30, `400 96px ${SERIF}`, K.white); txt('un 1% de A1c?', 540, 1090 + (1 - a) * 30, `italic 400 104px ${SERIF}`, K.greenLight); c.restore();
}
function sceneEducation(t) {   // educación estructurada: hasta –1%, como un medicamento
  const a = easeOut(prog(t, S('e1'), .6)); c.save(); c.globalAlpha *= a; c.translate(0, (1 - a) * 40);
  label('Educación estructurada', 540, 300, K.amber, 'center');
  shadowCard(140, 360, 800, 480, 36); iconBook(540, 470, 2, K.green);
  const n = pop(t, X.uno1 - .2, .6); if (n > 0) { c.save(); scaleAt(540, 660, n); c.globalAlpha *= Math.min(1, n); txt('hasta –1%', 540, 700, `700 120px ${SERIF}`, K.amber); c.restore(); }
  txt('de A1c', 540, 780, `500 40px ${SANS}`, K.char60); c.restore();
  const m = easeOut(prog(t, X.medicamento - .4, .6)); if (m > 0) { c.save(); c.globalAlpha *= m;
    txt('=', 540, 1010, `700 90px ${SANS}`, K.char30);
    shadowCard(240, 1080, 600, 200, 30, K.green); iconPill(380, 1180, 1.6); txt('Tanto como', 470, 1170, `500 36px ${SANS}`, K.greenLight, 'left'); txt('un medicamento', 470, 1225, `600 44px ${SERIF}`, K.white, 'left'); c.restore(); }
}
function sceneSteps(t) {   // Entender → Decidir → Mantener
  const a = easeOut(prog(t, S('e2'), .6)); c.save(); c.globalAlpha *= a;
  label('¿Qué es una', 540, 260, K.amber, 'center'); txt('educación estructurada?', 540, 345, `600 64px ${SERIF}`, K.char); c.restore();
  const m = easeOut(prog(t, X.mas - .3, .5)); if (m > 0) { c.save(); c.globalAlpha *= m * (1 - prog(t, X.camino - .2, .4) * .55); pill('Más que recibir información', 540, 450, 1, K.amberLight, K.amber, 34); c.restore(); }
  const ST = [['entiendes', 'Entender', 'tu diabetes', iconBook], ['decisiones', 'Decidir', 'en tu día a día', iconSign], ['habitos', 'Mantener', 'hábitos que se quedan', iconLoop]];
  const y0 = 560, dy = 330;
  const lp = ST.reduce((mm, s, i) => t > X[s[0]] - .2 ? i : mm, -1);
  const cam = easeOut(prog(t, X.camino - .2, .6)); if (cam > 0) { c.strokeStyle = K.creamDark; c.lineWidth = 10; c.beginPath(); c.moveTo(200, y0 + 110); c.lineTo(200, y0 + 110 + 2 * dy * cam); c.stroke(); }
  if (lp > 0) { c.strokeStyle = K.amber; c.lineWidth = 10; c.beginPath(); c.moveTo(200, y0 + 110); c.lineTo(200, y0 + 110 + dy * (lp - 1 + ease(prog(t, X[ST[lp][0]] - .2, .6)))); c.stroke(); }
  ST.forEach(([k, l1, l2, ic], i) => { const at = X[k] - .2, f = easeOut(prog(t, at, .55)), y = y0 + i * dy; if (cam <= 0) return;
    c.save(); c.globalAlpha *= Math.max(.25 * cam, f); c.translate((1 - f) * 50, 0); shadowCard(300, y + 10, 680, 200, 26, f > .5 && i === lp ? K.green : K.white);
    ic(410, y + 110, 1.1, f > .5 && i === lp ? K.greenLight : K.green); txt(l1, 500, y + 100, `600 56px ${SERIF}`, f > .5 && i === lp ? K.white : K.char, 'left'); txt(l2, 500, y + 155, `500 34px ${SANS}`, f > .5 && i === lp ? K.greenLight : K.char60, 'left'); c.restore();
    const s = Math.max(pop(t, at), cam * .001); c.save(); scaleAt(200, y + 110, Math.max(s, .6 * cam)); circ(200, y + 110, 50, f > .3 ? K.amber : K.char30); txt(String(i + 1), 200, y + 128, `700 48px ${SANS}`, K.white); c.restore(); });
