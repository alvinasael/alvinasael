<div class="slide-page slide-anim" data-index="{{INDEX}}" data-titulo="{{TITULO}}" data-fuente="{{FUENTE}}">
  <script>{{INCLUIR:_motor-celula.js}}</script>
  <script>
  (function () {
    const root = document.currentScript.closest('.slide-page');
    const { prog, lerp, easeOut } = NHCelula;

    // Cinco receptores: sin tratamiento solo se ocupan dos; con insulina se ocupan todos
    const RECEPTORS = [110, 215, 320, 425, 530];
    const BASE_REC = [1, 0, 1, 0, 0];
    const BASE_FUSE = [0, 0, 1, 0];          // la persona con DM2 ya tiene una sola puerta arriba

    NHCelula.mount(root, {
      receptors: RECEPTORS,
      legend: ['glucosa', 'insulina', 'receptor', 'glut4'],
      steps: [
        { label: 'Después de comer', caption: 'La misma persona con diabetes tipo 2, después de comer. Su propia insulina llega, pero no alcanza para vencer la resistencia.' },
        { label: 'Se inyecta insulina', caption: 'La insulina se inyecta bajo la piel y pasa poco a poco a la sangre. Ahora circula mucha más insulina.' },
        { label: 'Más señal', caption: 'Con más insulina se ocupan más receptores. La señal se suma y suben más puertas GLUT4, aunque la resistencia sigue ahí.' },
        { label: 'Baja la glucosa', caption: 'Entra más glucosa al músculo y el hígado suelta menos. La glucosa baja. El médico ajusta la dosis para evitar bajones de azúcar.' },
      ],
      panels: [
        {
          label: 'Diabetes tipo 2 · sin insulina', tone: 'amber', labels: true, liver: true,
          aria: 'Ilustración: célula muscular de una persona con diabetes tipo 2 sin tratamiento con insulina',
          state: (s, t) => ({
            G: s < 3 ? 232 : lerp(232, 226, easeOut(prog(t, .5, 10))),
            freeIns: 3,
            rec: BASE_REC,
            fuse: BASE_FUSE,
            glow: .25,
            signal: { r: 26, a: .3 },
            uptake: { elapsed: t, every: 2.6 },
            liver: .85,
          }),
        },
        {
          label: 'Diabetes tipo 2 · con insulina', tone: 'green', liver: true,
          aria: 'Ilustración: célula muscular de una persona con diabetes tipo 2 después de inyectarse insulina',
          state: (s, t) => {
            if (s === 0) return { G: 232, freeIns: 3, rec: BASE_REC, fuse: BASE_FUSE, glow: .25, signal: { r: 26, a: .3 }, uptake: { elapsed: t, every: 2.6 }, liver: .85 };
            if (s === 1) return {
              G: 232, freeIns: 3 + Math.round(7 * prog(t, .3, 3)), rec: BASE_REC, fuse: BASE_FUSE, glow: .25,
              signal: { r: 26, a: .3 }, uptake: { elapsed: t, every: 2.6 }, liver: .85,
              tag: { text: 'Insulina de la inyección', alpha: prog(t, .2, .6) },
            };
            if (s === 2) {
              const arrive = [1, 3, 4];
              return {
                G: 232, freeIns: 10,
                rec: BASE_REC.map((v, i) => v || prog(t, .3 + arrive.indexOf(i) * .6, 2.4)),
                fuse: [0, prog(t, 3.2, 1.8), 1, prog(t, 3.7, 1.8)],
                glow: lerp(.25, 1, prog(t, 1.5, 1.5)),
                signal: { r: lerp(26, 62, prog(t, 1.5, 2)), a: lerp(.3, .5, prog(t, 1.5, 2)) },
                uptake: { elapsed: t, every: t < 5 ? 2.6 : 1 },
                liver: .85,
              };
            }
            return {
              G: lerp(232, 150, easeOut(prog(t, .5, 10))), freeIns: 10,
              rec: [1, 1, 1, 1, 1], fuse: [0, 1, 1, 1], glow: 1,
              signal: { r: 62, a: .5 },
              uptake: { elapsed: t, every: .6 },
              liver: lerp(.85, .25, easeOut(prog(t, .5, 6))),
            };
          },
        },
      ],
    });
  })();
  </script>
</div>
